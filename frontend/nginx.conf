server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: client-side routes (/me, /holds/:id, ...) all serve index.html.
    # index.html itself is never cached so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
